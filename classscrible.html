<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClassScribble – School Themed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --primary:#3b82f6; --secondary:#facc15;
  --bg:#f1f5f9; --panel:#e2e8f0; --text:#1e293b;
  --accent:#2563eb; --hover:#60a5fa; --shadow:0 4px 6px rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;}
.sidebar{
  width:280px;background:var(--panel);padding:15px;overflow:auto;border-right:1px solid #cbd5e1;
  display:flex;flex-direction:column;gap:10px;
}
.sidebar h2{font-family:'Poppins',sans-serif;font-weight:700;color:var(--primary);margin-bottom:10px;text-align:center;}
.sidebar button,.sidebar select{width:100%;padding:6px;margin-bottom:6px;border-radius:6px;border:none;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:500;transition:0.2s;box-shadow:var(--shadow);}
.sidebar button{background:var(--primary);color:white;} .sidebar button:hover{background:var(--hover);}
.sidebar select{background:white;border:1px solid #cbd5e1;}
#toolbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
#toolbar button,#toolbar select{flex:0 0 auto;padding:4px 6px;font-size:0.8em;border-radius:6px;background:white;color:var(--text);box-shadow:var(--shadow);}
#toolbar button:hover{background:var(--secondary);color:white;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}
#pageArea{flex:1;background:white;margin:10px 0;padding:20px;border-radius:12px;overflow:auto;font-family:'Roboto',sans-serif;font-size:16px;line-height:1.5em;box-shadow:var(--shadow);}
#pageArea[contenteditable="true"]{outline:none;}
.thumbnailContainer{display:flex;overflow-x:auto;margin-top:10px;gap:6px;padding-bottom:4px;}
.thumbnail{background:var(--panel);color:var(--text);padding:6px;border-radius:6px;cursor:pointer;min-width:60px;text-align:center;box-shadow:var(--shadow);transition:0.2s;}
.thumbnail:hover{background:var(--secondary);color:white;}
.thumbnail.active{border:2px solid var(--primary);}
.thumbnail.dragging{opacity:0.5;}
.themeSelect{width:100%;padding:6px;margin-bottom:6px;border-radius:6px;}
.fullscreen{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:2em;z-index:1000;display:none;flex-direction:column;overflow:auto;}
.fullscreen .content{width:90%;height:80%;overflow:auto;transform-origin:center center;background:white;padding:20px;border-radius:12px;box-shadow:var(--shadow);}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px;}
::-webkit-scrollbar-track{background:#f1f5f9;}
</style>
</head>
<body>

<div class="sidebar">
<h2>ClassScribble made by <a href="tme.html">TME(tutoring made easy)</a></h2>

<button onclick="createPresentation()">+ New Presentation</button>
<select id="presentationSelect" onchange="switchPresentation(this.value)"></select>

<div id="toolbar">
  <button onclick="format('bold')"><b>B</b></button>
  <button onclick="format('italic')"><i>I</i></button>
  <button onclick="format('underline')"><u>U</u></button>
  <select onchange="format('fontSize', this.value)">
    <option value="3">Normal</option>
    <option value="4">Large</option>
    <option value="5">Larger</option>
    <option value="6">Huge</option>
  </select>
  <button onclick="format('insertOrderedList')">OL</button>
  <button onclick="format('insertUnorderedList')">UL</button>
  <button onclick="format('justifyLeft')">Left</button>
  <button onclick="format('justifyCenter')">Center</button>
  <button onclick="format('justifyRight')">Right</button>
  <button onclick="format('undo')">↶</button>
  <button onclick="format('redo')">↷</button>
</div>

<button onclick="addPage()">Add Slide</button>
<button onclick="deletePage()">Delete Slide</button>

<select class="themeSelect" id="themeSelect" onchange="changeTheme(this.value)">
  <option value="default">Default</option>
  <option value="dark">Dark</option>
  <option value="light">Light</option>
  <option value="blue">Blue</option>
</select>

<button onclick="enterPresentation()">Presentation Mode</button>
<button onclick="exportPDF()">Export PDF (Landscape)</button>
</div>

<div class="main">
<div id="pageArea" contenteditable="true" placeholder="Type your slide content here..."></div>
<div class="thumbnailContainer" id="thumbnailContainer"></div>
</div>

<div class="fullscreen" id="fullscreen">
  <div class="content" id="fsContent"></div>
  <div style="margin-top:20px;font-size:16px;">
    Zoom: <button onclick="scalePresentation(0.8)">-</button> 
    <button onclick="scalePresentation(1.0)">100%</button> 
    <button onclick="scalePresentation(1.2)">+</button>
    | Press Esc to exit | ← → for slides
  </div>
</div>

<script>
// ==========================
// ClassScribble JS
// ==========================

// Multi-presentation logic
let presentations = JSON.parse(localStorage.getItem("classScribblePresentations")) || {};
let currentPresentation = null;
let pages = [];
let currentPage = 0;
let currentScale = 1.0;

const pageArea = document.getElementById("pageArea");
const thumbnailContainer = document.getElementById("thumbnailContainer");
const fullscreenDiv = document.getElementById("fullscreen");
const fsContent = document.getElementById("fsContent");
const themeSelect = document.getElementById("themeSelect");
const presentationSelect = document.getElementById("presentationSelect");

// Save presentations
function savePresentations(){
  if(currentPresentation) presentations[currentPresentation] = pages;
  localStorage.setItem("classScribblePresentations", JSON.stringify(presentations));
}

// Presentation Management
function createPresentation(){
  const name = prompt("Enter presentation name:");
  if(!name) return;
  if(presentations[name]) { alert("Name exists!"); return; }
  presentations[name] = [];
  currentPresentation = name;
  pages = [];
  currentPage = 0;
  updatePresentationSelect();
  renderPages();
  savePresentations();
}
function switchPresentation(name){
  if(!name) return;
  savePresentations();
  currentPresentation = name;
  pages = presentations[name] || [];
  currentPage = 0;
  renderPages();
}
function updatePresentationSelect(){
  presentationSelect.innerHTML = "";
  Object.keys(presentations).forEach(name=>{
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    if(name===currentPresentation) opt.selected = true;
    presentationSelect.appendChild(opt);
  });
}

// Slide Management
function addPage(){ pages.push({content:"New Slide", theme:"default"}); currentPage = pages.length-1; renderPages(); savePresentations(); }
function deletePage(){ if(pages.length===0) return; if(confirm("Delete current slide?")){ pages.splice(currentPage,1); currentPage = Math.max(0,currentPage-1); renderPages(); savePresentations(); }}

// Render Pages & Thumbnails
function renderPages(){
  if(pages.length===0){ pageArea.innerHTML=""; thumbnailContainer.innerHTML=""; return; }
  pageArea.innerHTML = pages[currentPage].content;
  applyTheme(pages[currentPage].theme);

  thumbnailContainer.innerHTML="";
  pages.forEach((p,i)=>{
    const thumb = document.createElement("div");
    thumb.className = "thumbnail"+(i===currentPage?" active":"");
    thumb.innerText = "Slide "+(i+1);
    thumb.draggable = true;
    thumb.onclick = ()=>{currentPage=i; renderPages();}
    thumb.addEventListener("dragstart", e=>{ thumb.classList.add("dragging"); e.dataTransfer.setData("text/plain", i); });
    thumb.addEventListener("dragend", ()=>{ thumb.classList.remove("dragging"); });
    thumb.addEventListener("dragover", e=>{ e.preventDefault(); });
    thumb.addEventListener("drop", e=>{
      const fromIndex = parseInt(e.dataTransfer.getData("text/plain"));
      const toIndex = i;
      const moved = pages.splice(fromIndex,1)[0];
      pages.splice(toIndex,0,moved);
      currentPage = toIndex;
      renderPages();
      savePresentations();
    });
    thumbnailContainer.appendChild(thumb);
  });
}
pageArea.addEventListener("input",()=>{ if(pages[currentPage]) pages[currentPage].content = pageArea.innerHTML; savePresentations(); });

// Themes
function applyTheme(theme){
  const themes={default:{bg:"#ffffff",text:"#1e293b"},dark:{bg:"#1e1e1e",text:"#f1f5f9"},light:{bg:"#f9fafb",text:"#1e293b"},blue:{bg:"#1e40af",text:"#f1f5f9"}};
  const t=themes[theme]||themes.default;
  pageArea.style.background=t.bg; pageArea.style.color=t.text;
  pages[currentPage].theme = theme; themeSelect.value = theme;
}
function changeTheme(theme){ applyTheme(theme); savePresentations(); }

// WYSIWYG
function format(command,value=null){ document.execCommand(command,false,value); pageArea.focus(); }

// Presentation Mode
function enterPresentation(){ if(pages.length===0) return; currentScale=1.0; fsContent.innerHTML=pages[currentPage].content; fsContent.style.transform=`scale(${currentScale})`; fullscreenDiv.style.display="flex";}
function scalePresentation(scale){ currentScale=scale; fsContent.style.transform=`scale(${currentScale})`; }

// Keyboard Shortcuts
document.addEventListener("keydown", e=>{
  if(e.ctrlKey && e.shiftKey){
    if(e.key === "<"){ e.preventDefault(); adjustFontSize(-1); }
    if(e.key === ">"){ e.preventDefault(); adjustFontSize(1); }
  }
  if(fullscreenDiv.style.display==="flex"){
    if(e.key==="Escape"){ fullscreenDiv.style.display="none"; }
    if(e.key==="ArrowRight"){ currentPage=Math.min(pages.length-1,currentPage+1); fsContent.innerHTML=pages[currentPage].content; fsContent.style.transform=`scale(${currentScale})`;}
    if(e.key==="ArrowLeft"){ currentPage=Math.max(0,currentPage-1); fsContent.innerHTML=pages[currentPage].content; fsContent.style.transform=`scale(${currentScale})`;}
  } else {
    if(e.key==="ArrowRight"){ currentPage=Math.min(pages.length-1,currentPage+1); renderPages(); }
    if(e.key==="ArrowLeft"){ currentPage=Math.max(0,currentPage-1); renderPages(); }
  }
});

// Font Size Adjustment
function adjustFontSize(delta){
  const selection = window.getSelection();
  if(!selection.rangeCount) return;
  const range = selection.getRangeAt(0);
  const span = document.createElement("span");
  let currentSize=parseInt(window.getComputedStyle(selection.focusNode.parentNode).fontSize)||16;
  span.style.fontSize=(currentSize+delta)+"px";
  try{ range.surroundContents(span); } catch(e){ document.execCommand("fontSize",false,3); }
  selection.removeAllRanges(); selection.addRange(range);
  if(pages[currentPage]) pages[currentPage].content=pageArea.innerHTML; savePresentations();
}

// Export PDF with html2canvas
async function exportPDF(){
  if(pages.length===0) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  for(let i=0;i<pages.length;i++){
    const tempDiv=document.createElement('div');
    tempDiv.style.width='1122px'; tempDiv.style.minHeight='794px';
    tempDiv.style.background=pageArea.style.background||"#ffffff";
    tempDiv.style.color=pageArea.style.color||"#1e293b";
    tempDiv.style.padding='20px'; tempDiv.innerHTML=pages[i].content;
    document.body.appendChild(tempDiv);
    const canvas=await html2canvas(tempDiv,{scale:2});
    const imgData=canvas.toDataURL("image/png");
    const pageWidth=doc.internal.pageSize.getWidth();
    const pageHeight=doc.internal.pageSize.getHeight();
    doc.addImage(imgData,'PNG',0,0,pageWidth,pageHeight);
    document.body.removeChild(tempDiv);
    if(i<pages.length-1) doc.addPage();
  }
  doc.save(currentPresentation?`${currentPresentation}_Slides.pdf`:"ClassScribble_Slides.pdf");
}

// Initialization
if(Object.keys(presentations).length>0){ currentPresentation=Object.keys(presentations)[0]; pages=presentations[currentPresentation]; }
updatePresentationSelect(); renderPages();
</script>
</body>
</html>
