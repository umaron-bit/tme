<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClassScribble</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  display:flex;
  height:100vh;
  background:#f4f7fb;
}

/* SIDEBAR */
.sidebar{
  width:70px;
  background:#1f3c88;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 5px;
  gap:10px;
}
.sidebar button{
  width:40px;
  height:40px;
  border:none;
  border-radius:8px;
  background:#2e5cb8;
  color:white;
  cursor:pointer;
  font-size:16px;
}
.sidebar button:hover{
  background:#4d79ff;
}

/* MAIN AREA */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  background:#ffffff;
  padding:10px 20px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
}

/* SLIDE AREA */
.slide-container{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#e9edf5;
}

.slide{
  width:1120px;
  height:630px;
  background:white;
  padding:40px;
  overflow:auto;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.slide[contenteditable="true"]:focus{
  outline:2px solid #4d79ff;
}

/* THUMBNAILS */
.thumbnails{
  height:90px;
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px;
  background:#ffffff;
  border-top:1px solid #ddd;
}

.thumb{
  width:160px;
  height:80px;
  background:white;
  border:2px solid transparent;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  padding:5px;
  overflow:hidden;
}
.thumb.active{
  border-color:#4d79ff;
}

/* MODAL */
.modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
.modal input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}
.modal button{
  padding:6px 12px;
  border:none;
  background:#4d79ff;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

/* ALIGNMENT */
.left{text-align:left}
.center{text-align:center}
.right{text-align:right}
</style>
</head>
<body>

<div class="sidebar">
<button onclick="format('bold')"><b>B</b></button>
<button onclick="format('italic')"><i>I</i></button>
<button onclick="format('underline')"><u>U</u></button>
<button onclick="format('superscript')">x²</button>
<button onclick="format('subscript')">x₂</button>
<button onclick="format('insertUnorderedList')">•</button>
<button onclick="format('insertOrderedList')">1.</button>
<button onclick="format('undo')">↺</button>
<button onclick="format('redo')">↻</button>
  <button onclick="addSlide()">＋</button>
  <button onclick="deleteSlide()">－</button>
  <button onclick="setAlign('left')">L</button>
  <button onclick="setAlign('center')">C</button>
  <button onclick="setAlign('right')">R</button>
  <button onclick="openMath()">∑</button>
  <button onclick="exportPDF()">PDF</button>
</div>

<div class="main">
  <div class="header">
    <span>ClassScribble</span>
    <button onclick="newPresentation()">New Presentation</button>
  </div>

  <div class="slide-container">
    <div id="slide" class="slide center" contenteditable="true">
      <h1>Welcome to ClassScribble</h1>
      <p>Start typing here...</p>
    </div>
  </div>

  <div id="thumbnails" class="thumbnails"></div>
</div>

<!-- Math Modal -->
<div id="mathModal" class="modal">
  <h3>Insert Equation</h3>
  <input id="mathInput" placeholder="Example: \frac{a}{b}">
  <button onclick="insertMath()">Insert</button>
  <button onclick="closeMath()">Cancel</button>
</div>

<script>
let slides = [{
  content: document.getElementById("slide").innerHTML,
  align: "center"
}];

let current = 0;

/* ---------------------------
   SLIDE MANAGEMENT
---------------------------- */

function renderThumbnails() {
  const container = document.getElementById("thumbnails");
  container.innerHTML = "";
  slides.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "thumb" + (i === current ? " active" : "");
    div.innerHTML = s.content;
    div.onclick = () => switchSlide(i);
    container.appendChild(div);
  });
}

function switchSlide(i) {
  saveSlide();
  current = i;
  const slide = document.getElementById("slide");
  slide.innerHTML = slides[i].content;
  slide.className = "slide " + slides[i].align;
  renderThumbnails();
}

function saveSlide() {
  const slide = document.getElementById("slide");
  slides[current].content = slide.innerHTML;
  slides[current].align =
    slide.classList.contains("left") ? "left" :
    slide.classList.contains("right") ? "right" :
    "center";
}

function addSlide() {
  saveSlide();
  slides.push({ content: "<h2>New Slide</h2>", align: "center" });
  switchSlide(slides.length - 1);
}

function deleteSlide() {
  if (slides.length === 1) return;
  slides.splice(current, 1);
  current = 0;
  switchSlide(0);
}

function newPresentation() {
  slides = [{
    content: "<h1>New Presentation</h1>",
    align: "center"
  }];
  current = 0;
  switchSlide(0);
}

/* ---------------------------
   ALIGNMENT
---------------------------- */

function setAlign(type) {
  const slide = document.getElementById("slide");
  slide.className = "slide " + type;
}

/* ---------------------------
   WYSIWYG COMMANDS
---------------------------- */

function format(command, value = null) {
  document.execCommand(command, false, value);
}

/* Buttons you should add in sidebar:
   format('bold')
   format('italic')
   format('underline')
   format('superscript')
   format('subscript')
   format('insertUnorderedList')
   format('insertOrderedList')
   format('undo')
   format('redo')
*/

/* ---------------------------
   MATH SUPPORT
---------------------------- */

function openMath() {
  document.getElementById("mathModal").style.display = "block";
}

function closeMath() {
  document.getElementById("mathModal").style.display = "none";
}

function insertMath() {
  const val = document.getElementById("mathInput").value;
  const span = document.createElement("span");

  katex.render(val, span, { throwOnError: false });
  document.getElementById("slide").appendChild(span);

  closeMath();
}

/* ---------------------------
   EXPORT PDF (LANDSCAPE)
---------------------------- */

function exportPDF() {
  saveSlide();

  const container = document.createElement("div");

  slides.forEach(s => {
    const div = document.createElement("div");
    div.style.width = "1120px";
    div.style.height = "630px";
    div.style.padding = "40px";
    div.style.pageBreakAfter = "always";
    div.innerHTML = s.content;
    container.appendChild(div);
  });

  html2pdf().set({
    margin: 0,
    filename: "ClassScribble.pdf",
    html2canvas: { scale: 2 },
    jsPDF: { unit: "px", format: [1120, 630], orientation: "landscape" }
  }).from(container).save();
}

/* ---------------------------
   FONT SIZE SHORTCUTS
---------------------------- */

document.addEventListener("keydown", e => {

  if (e.ctrlKey && e.shiftKey && e.key === "<") {
    e.preventDefault();
    document.execCommand("fontSize", false, "3");
  }

  if (e.ctrlKey && e.shiftKey && e.key === ">") {
    e.preventDefault();
    document.execCommand("fontSize", false, "6");
  }

});

/* Auto-save on typing */
document.getElementById("slide").addEventListener("input", saveSlide);

renderThumbnails();

</script>
</body>
</html>
